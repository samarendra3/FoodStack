name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1

  e2e:
    name: Database and API e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodstack_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: foodstack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodstack_owner -d foodstack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_NAME: foodstack_test
      DATABASE_USER: foodstack_app
      DATABASE_PASSWORD: ci-app-password
      DATABASE_MIGRATION_USER: foodstack_owner
      DATABASE_MIGRATION_PASSWORD: ci-owner-password
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same scripts the local Postgres container runs on a fresh volume.
      - name: Create test database and app role
        env:
          PGHOST: localhost
          PGPASSWORD: ci-owner-password
          POSTGRES_USER: foodstack_owner
          POSTGRES_DB: foodstack
        run: |
          psql -v ON_ERROR_STOP=1 -U foodstack_owner -d postgres -f infra/docker/postgres/init/01-test-database.sql
          sh infra/docker/postgres/init/02-app-role.sh

      - name: e2e tests
        run: pnpm --filter @foodstack/api test:e2e

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { name: api, file: infra/docker/api.Dockerfile, args: '' }
          - { name: admin, file: infra/docker/next.Dockerfile, args: 'APP=admin' }
          - { name: pos, file: infra/docker/next.Dockerfile, args: 'APP=pos' }
          - { name: kds, file: infra/docker/next.Dockerfile, args: 'APP=kds' }
          - { name: qr, file: infra/docker/next.Dockerfile, args: 'APP=qr' }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.args }}
            NEXT_PUBLIC_API_URL=https://api.example.invalid/api/v1
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
