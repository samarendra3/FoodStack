# Local stand-in for the AWS ALB: round-robin over every api-ha replica, passive health
# checks (a replica failing 3 times is skipped for 10 s), idempotent retry on connect errors.
worker_processes auto;
events { worker_connections 4096; }
http {
  access_log off;
  # Docker DNS: re-resolve so scaled replicas are picked up.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    server api-ha:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  server {
    listen 8080;
    location = /lb-health { return 200 'ok'; }
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      # The ALB appends the client address; the API trusts exactly one hop (TRUST_PROXY).
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
