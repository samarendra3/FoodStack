packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (native bindings). Telemetry scripts stay blocked.
allowBuilds:
  '@parcel/watcher': true
  argon2: true
  msgpackr-extract: true
  unrs-resolver: true
  '@scarf/scarf': false

# Reviewed advisories (`pnpm audit` fails on anything not listed). Dev-only lint tooling; never
# reaches the API or web bundles. Remove once eslint-config-next pulls a patched minimatch.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249 # moderate: minimatch globparts DoS (via eslint-config-next)
