packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (native bindings). Telemetry scripts stay blocked.
allowBuilds:
  '@parcel/watcher': true
  msgpackr-extract: true
  unrs-resolver: true
  '@scarf/scarf': false

# Reviewed advisories (`pnpm audit` in CI fails on anything not listed). Re-check on every Expo
# upgrade and remove entries once fixed. All four come only through Expo's development tooling
# in apps/waiter-mobile (@expo/cli, @expo/config); none reach the API, web bundles or the app
# binary. No in-range fix exists: @expo/cli requires zod ^3 (patched only in 4.6.6), and
# glob/minimatch are patched only in later majors that Expo does not support.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5 # high: zod <4.6.6 memory exhaustion (via @expo/cli)
    - GHSA-g3hv-75wg-m249 # moderate: minimatch globparts DoS (via @expo/config)
    - GHSA-3g3m-2fjr-6pw4 # moderate: glob AbortSignal bypass (via @expo/config)
    - GHSA-gcqx-w48m-w2h4 # low: deepmerge prototype poisoning, no fix released (via @expo/config)
