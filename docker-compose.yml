# Local development stack. Ports bind to 127.0.0.1 only; production uses managed AWS
# services (RDS, ElastiCache) in private subnets - see docs/deployment.md.
#
#   docker compose up -d postgres redis          # infrastructure only (run apps with pnpm dev)
#   docker compose --profile apps up -d --build  # everything in containers

name: foodstack

x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # The container superuser is the migration role (schema owner). The API's restricted role is
    # created by infrastructure/docker/postgres/init/02-app-role.sh on first start.
    environment:
      POSTGRES_USER: ${DATABASE_MIGRATION_USER:?set DATABASE_MIGRATION_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?set DATABASE_MIGRATION_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:-foodstack}
      APP_DB_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot: applies pending migrations as the schema owner, then exits. The api waits for it.
  migrate:
    profiles: [apps]
    build: &api-build
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment: &api-env
      NODE_ENV: production
      SWAGGER_ENABLED: 'false'
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    command:
      ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/database/data-source.js']
    restart: 'no'
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [apps]
    build: *api-build
    env_file: .env
    # Production rules apply: JWT_PRIVATE_KEY / JWT_PUBLIC_KEY must be set in .env
    # (pnpm --filter @foodstack/api keys:generate) and API docs are off.
    environment: *api-env
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    profiles: [apps]
    build: &next-build
      context: .
      dockerfile: infrastructure/docker/next.Dockerfile
      args:
        { APP: web, NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}' }
    environment: { <<: *app-env, PORT: 3000 }
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]

  pos:
    profiles: [apps]
    build:
      {
        <<: *next-build,
        args:
          { APP: pos, NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}' },
      }
    environment: { <<: *app-env, PORT: 3000 }
    ports: ['127.0.0.1:3001:3000']
    depends_on: [api]

  kitchen-display:
    profiles: [apps]
    build:
      {
        <<: *next-build,
        args:
          {
            APP: kitchen-display,
            NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}',
          },
      }
    environment: { <<: *app-env, PORT: 3000 }
    ports: ['127.0.0.1:3002:3000']
    depends_on: [api]

  qr:
    profiles: [apps]
    build:
      {
        <<: *next-build,
        args:
          { APP: qr, NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}' },
      }
    environment: { <<: *app-env, PORT: 3000 }
    ports: ['127.0.0.1:3003:3000']
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
